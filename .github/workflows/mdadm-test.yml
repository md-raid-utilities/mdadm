---
name: mdadm test
on:
  push:
    branches:
      - test_on_push
    paths:
      - '*.c'
      - '*.h'
      - 'tests/*'
      - 'test'
      - '.github/workflows/mdadm-test.yml'
  pull_request:
    paths:
      - '*.c'
      - '*.h'
      - 'tests/*'
      - 'test'
      - '.github/workflows/mdadm-test.yml'
  workflow_dispatch:
jobs:
  mdadm_tests:
    runs-on: ubuntu-latest
    name: Run mdadm test script
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: >-
          sudo apt update &&
          sudo apt install
          --yes --no-upgrade --no-install-recommends --no-install-suggests
          make gcc libudev-dev

      - name: Build mdadm
        run: make -j$(nproc) BINDIR=/usr/sbin

      - name: Install mdadm
        run: sudo make BINDIR=/usr/sbin install-bin

      - name: Print mdadm version
        run: mdadm --version

      - name: Set targetdir to /mnt/tmp
        run: sed -i '/^targetdir=/s,/var/tmp,/mnt/tmp,' test

      - name: Create targetdir
        run: sudo mkdir -p /mnt/tmp

      - name: Run tests
        id: run_tests
        run: >-
          sudo timeout --signal=TERM --kill-after=30s
          ${{ github.event_name == 'pull_request' && '30m' || '300m' }}
          ./test --skip-broken
          --disable-integrity --disable-multipath --disable-linear
          --keep-going
          ${{ github.event_name == 'pull_request' && '--skip-bigcase' || '' }}
        continue-on-error: true

      - name: Collect test diagnostics
        if: always() && steps.run_tests.outcome != 'success'
        run: |
          sudo mkdir -p /mnt/tmp
          sudo cp /mnt/tmp/log /mnt/tmp/current-test.log || true
          sudo cp /mnt/tmp/stderr /mnt/tmp/current-stderr.log || true
          sudo timeout --kill-after=5s 20s bash -c '
            exec > /mnt/tmp/test-diagnostics.log 2>&1
            date -u
            ps -eo pid,ppid,stat,wchan:32,args
            cat /proc/mdstat
            for f in /sys/block/md*/md/array_state /sys/block/md*/md/sync_action /sys/block/md*/md/sync_completed; do
              echo "$f"
              cat "$f"
            done
            dmesg
          ' || true

      - name: Collect test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "mdadm-failed-test-logs"
          path: /mnt/tmp/*.log

      - name: Fail if any test failed
        if: steps.run_tests.outcome != 'success'
        run: /bin/false
